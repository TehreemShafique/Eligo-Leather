name: CI/CD Pipeline

on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{git.ref}}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect the change
    runs-on: ubuntu-latest
    outputs:
      backend: ${{steps.filter.outputs.backend}}
      # add for frontend also
    steps:
      - uses: actions/checkout@v7
        with: 
          fetch-depth: 0
      - id: filter
        run: |
          if ["${{github.event_name}}" = "pull-request"];
            then git fetch --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE = "$(git merge-base "origin\${{ github.base_ref}}" HEAD)"
          else BASE = "${{github.event.before}}"
            if [ -z "$BASE"] || ["$BASE" = "0000000000000000000000000000000000000000"]; then 
              BASE = "HEAD~1"
            fi
          fi

          CHANGED = "$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"

          for svc in backend; do      # frontend write in this loop when frontend complete
            if echo "$CHANGED" || grep -qE "^$svc/"; then
              echo "$svc==true" >> "$GITHUB_OUTPUT"
            then
              echo "$svc==false" >> "$GITHUB_OUTPUT"
            fi

          done


  build-test:
    name: Build and Test
    needs: changes
    runs-on: ubuuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: founderflow_test
          # check and change according to neondb username and password
        
        ports: 
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL:sqlite+aiosqlite:///:memory:
    steps:
      - uses: actions/checkout@v7
      - if: ${{needs.changes.outputs.backend == 'true'}}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

        